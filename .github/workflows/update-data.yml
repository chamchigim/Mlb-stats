{"name":"update-mlb-data","on":{"workflow_dispatch":{},"schedule":[{"cron":"0 21 * * *"}]},"permissions":{"contents":"write"},"jobs":{"update":{"runs-on":"ubuntu-latest","timeout-minutes":50,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"name":"MLB","run":"node mlb_scraper_v3.mjs --out data/mlb.json --history-out data/mlb-history.json --history-minutes 15","continue-on-error":true},{"name":"Extras","run":"node mlb_extras.mjs --seasons-out data/mlb-seasons.json --draft-out data/mlb-draft.json --minutes 12","continue-on-error":true},{"name":"Awards","run":"node mlb_awards.mjs --out data/mlb-awards.json --minutes 8","continue-on-error":true},{"name":"Commit","run":"git config user.name mlb-data-bot && git config user.email actions@users.noreply.github.com && git add data && (git diff --cached --quiet || (git commit -m update && git push))"}]}}}
