yaml
name: update-mlb-data
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 21 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node mlb_ingest.mjs --out data/mlb.json
      - run: |
          if [ -n "$(git status --porcelain data/mlb.json)" ]; then
            git config user.name "mlb-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/mlb.json
            git commit -m "update MLB data"
            git push
          fi
