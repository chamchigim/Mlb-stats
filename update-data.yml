name: update-mlb-data

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 21:00 UTC (한국 시간 오전 6시)
  workflow_dispatch: {}     # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch MLB data
        run: node mlb_ingest.mjs --out data/mlb.json
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/mlb.json)" ]; then
            git config user.name "mlb-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/mlb.json
            git commit -m "update MLB data $(date -u +%F)"
            git push
          else
            echo "변경 없음"
          fi
