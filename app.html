<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLB 스탯 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2EF; --panel:#FFFFFF; --ink:#13241D; --mute:#5B6B63; --line:#D3DCD6;
  --board:#12261F; --board-ink:#C9D8CE; --bulb:#F5C542;
  --accent:#D8343B; --s1:#D8343B; --s2:#1F7AA8; --s3:#B87F00; --s4:#7A4FB5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A15; --panel:#14281F; --ink:#E6EEE8; --mute:#93A59B; --line:#274236;
    --board:#091510; --board-ink:#A9BDB0; --bulb:#F5C542;
    --accent:#FF6B70; --s1:#FF6B70; --s2:#5BB8E8; --s3:#F0B429; --s4:#B79BEB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A15; --panel:#14281F; --ink:#E6EEE8; --mute:#93A59B; --line:#274236;
  --board:#091510; --board-ink:#A9BDB0; --bulb:#F5C542;
  --accent:#FF6B70; --s1:#FF6B70; --s2:#5BB8E8; --s3:#F0B429; --s4:#B79BEB;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-family:"Barlow Condensed","Noto Sans KR",sans-serif;font-weight:700;font-size:30px;letter-spacing:.01em;line-height:1.1}
.sub{margin:4px 0 0;color:var(--mute);font-size:13px}
.top{display:flex;flex-direction:column;gap:14px;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel);align-self:flex-start}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-weight:500;padding:6px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:500;padding:10px 0;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
button:focus-visible,select:focus-visible,.filebtn:focus-within{outline:2px solid var(--s2);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:16px 0 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 14px;align-items:flex-end}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
.lbl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);min-width:0}
.who{margin:6px 0 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who b{font-size:20px}
.who span{color:var(--mute);font-size:14px;margin-left:6px}
.favbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.favbtn[aria-pressed="true"]{border-color:var(--bulb);background:rgba(245,197,66,.16)}
/* scoreboard */
.board{background:var(--board);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.cell{border:1px solid rgba(201,216,206,.22);border-radius:8px;padding:8px 6px 6px;text-align:center}
.cell .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;line-height:1.05;color:var(--bulb);font-variant-numeric:tabular-nums}
.cell .n{font-size:11px;color:var(--board-ink);margin-top:2px}
.cell.key{grid-column:span 2;background:rgba(245,197,66,.08);border-color:rgba(245,197,66,.5)}
.cell.key .v{font-size:48px}
h2{font-size:15px;margin:26px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--mute);margin-top:14px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:64px 1fr 52px;align-items:center;gap:10px;font-size:13px}
.bar .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--s2);border-radius:4px}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
th{color:var(--mute);font-weight:500}
tr.on td{background:rgba(245,197,66,.14)}
td.best{font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip.dim{color:var(--mute);border-style:dashed}
.chart{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.axl{font-size:11px;fill:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.rank{display:grid;gap:8px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row .no{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--mute)}
.row:first-child .no{color:var(--accent)}
.row .nm{font-weight:500}
.row .tm{font-size:12px;color:var(--mute)}
.row .rv{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.row .gauge{grid-column:2 / 4;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:-2px}
.row .gauge span{display:block;height:100%;background:var(--s2)}
.more{margin-top:12px}
.note{margin-top:14px;font-size:12px;color:var(--mute);line-height:1.6}
.tag{display:inline-block;font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:2px 8px;margin-top:8px}
.data{margin-top:34px}
.data h2{margin-top:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filebtn{position:relative;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.msg{font-size:13px;margin-top:10px;min-height:1.2em}
.msg.err{color:var(--accent)}
[hidden]{display:none!important}
.back{border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;padding:0;cursor:pointer;align-self:flex-start}
.back:hover{color:var(--ink)}
.land{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:24px}
.land h1{font-size:42px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pick{border:1px solid rgba(201,216,206,.22);background:var(--board);border-radius:16px;padding:28px 20px 22px;text-align:center;cursor:pointer;font:inherit}
.pick:hover{border-color:var(--bulb)}
.pick:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.pick .big{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:88px;line-height:1;color:var(--bulb);letter-spacing:.02em}
.pick .ko{display:block;margin-top:10px;font-size:16px;color:#EAF1E8}
input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.grow{flex:1 1 180px}
.count{font-size:12px;color:var(--mute);margin:8px 0 0}
.banner{background:rgba(245,197,66,.14);border:1px solid rgba(245,197,66,.45);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.topcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.topcard .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.topcard .th b{font-size:15px}
.link{border:0;background:transparent;color:var(--s2);font:inherit;font-size:12px;cursor:pointer;padding:0}
.topcard ol{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.topcard li{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:8px;align-items:baseline;font-size:13px}
.topcard li .no{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--mute)}
.topcard li:first-child .no{color:var(--accent)}
.topcard li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topcard li .tm{color:var(--mute);font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topcard li .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.rk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.rk .n{font-size:11px;color:var(--mute)}
.rk .r{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;line-height:1.1}
.rk .of{font-size:11px;color:var(--mute)}
.tabs button{font-size:14px}
.bdg{display:inline-block;font-size:10px;line-height:1.5;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--mute);vertical-align:middle;white-space:nowrap}
.bdg.q{color:var(--s2);border-color:var(--s2)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;color:var(--s2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none}
.filebtn.alt{background:transparent;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <section class="land" id="landing" hidden>
    <div>
      <h1>야구 스탯 분석</h1>
      <p class="sub">세이버메트릭스로 선수를 보고, 비교하고, 순위를 매깁니다. 리그를 먼저 고르세요.</p>
    </div>
    <div class="picks">
      <button class="pick" data-act="league" data-v="kbo"><span class="big">KBO</span><span class="ko">한국프로야구</span></button>
      <button class="pick" data-act="league" data-v="mlb"><span class="big">MLB</span><span class="ko">메이저리그</span></button>
    </div>
  </section>
  <div id="shell" hidden>
  <div class="top">
    <button class="back" data-act="home">← 리그 선택</button>
    <div>
      <h1 id="title">MLB 스탯 분석</h1>
      <p class="sub">세이버메트릭스로 선수를 보고, 비교하고, 순위를 매깁니다.</p>
      <span class="tag" id="tag"></span>
    </div>
    <div class="seg" role="group" aria-label="선수 유형" id="seg"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div id="filters"></div>
  <main id="app"></main>

  <section class="data card">
    <h2>데이터</h2>
    <div id="datastatus"></div>
    <div class="btns">
      <label class="filebtn">JSON 파일 불러오기<input type="file" id="file" accept="application/json,.json"></label>
      <button class="chip" id="resetbtn" data-act="reset">샘플로 되돌리기</button>
    </div>
    <div class="btns">
      <label class="filebtn alt">연봉·계약 CSV 불러오기<input type="file" id="cfile" accept=".csv,text/csv"></label>
      <button class="chip" id="cclear" data-act="cclear">연봉·계약 자료 지우기</button>
    </div>
    <p class="hint">CSV 첫 줄(열 이름) 예: 이름,선수ID,연도,연봉,계약시작,계약종료,총액,비고 — 이름 또는 선수ID, 그리고 연봉 또는 계약총액이 있으면 됩니다. 엑셀에서 저장할 때는 “CSV UTF-8”을 고르세요.</p>
    <div class="msg" id="msg" role="status"></div>
    <p class="note" id="note"></p>
  </section>
  </div>
</div>

<script>
(function(){
/* ---------- 유틸 ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const short=nm=>{const w=String(nm).replace(/\b(Jr\.?|Sr\.?|II|III|IV)$/i,'').trim().split(/\s+/);return w[w.length-1]||nm;};
const joinDot=a=>a.filter(Boolean).join(' · ');
const LEAGUES={mlb:{name:'MLB'},kbo:{name:'KBO'}};

/* ---------- 샘플 데이터 생성 (시드 고정, 가상 선수) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const SH=[
 {id:'h1',name:'Marcus Ellery',team:'Harbor Gulls',pos:'우익수',k:.24,bb:.11,hr:.065,babip:.300,d2:.22,sb:8,pa:640,seed:11},
 {id:'h2',name:'Tomas Rivero',team:'Prairie Hawks',pos:'유격수',k:.15,bb:.08,hr:.025,babip:.322,d2:.24,sb:24,pa:660,seed:22},
 {id:'h3',name:'Jin-woo Park',team:'Summit Bears',pos:'중견수',k:.19,bb:.09,hr:.035,babip:.318,d2:.20,sb:34,pa:650,seed:33},
 {id:'h4',name:'Callum Hayes',team:'Delta Herons',pos:'1루수',k:.20,bb:.14,hr:.058,babip:.305,d2:.20,sb:2,pa:620,seed:44},
 {id:'h5',name:'Andre Vasquez',team:'Harbor Gulls',pos:'3루수',k:.17,bb:.09,hr:.042,babip:.312,d2:.23,sb:10,pa:630,seed:55},
 {id:'h6',name:'Noah Bellamy',team:'Prairie Hawks',pos:'포수',k:.22,bb:.10,hr:.045,babip:.290,d2:.21,sb:3,pa:560,seed:66},
 {id:'h7',name:'Theo Marsh',team:'Summit Bears',pos:'대타',k:.26,bb:.07,hr:.030,babip:.285,d2:.20,sb:2,pa:210,seed:71},
 {id:'h8',name:'Luis Ferrer',team:'Delta Herons',pos:'외야수',k:.21,bb:.12,hr:.075,babip:.340,d2:.19,sb:1,pa:120,seed:81}
];
const SP=[
 {id:'p1',name:'Silas Whitmore',team:'Summit Bears',pos:'선발',ip:195,k9:10.6,bb9:2.2,hr9:1.0,h9:7.6,seed:77},
 {id:'p2',name:'Rafael Ortega',team:'Delta Herons',pos:'선발',ip:180,k9:8.4,bb9:2.8,hr9:1.2,h9:8.6,seed:88},
 {id:'p3',name:'Dominic Rhee',team:'Harbor Gulls',pos:'선발',ip:170,k9:9.5,bb9:3.3,hr9:0.9,h9:7.9,seed:99},
 {id:'p4',name:'Eli Granger',team:'Prairie Hawks',pos:'선발',ip:200,k9:7.2,bb9:1.9,hr9:1.3,h9:9.0,seed:101},
 {id:'p5',name:'Jamie Cole',team:'Harbor Gulls',pos:'구원',ip:60,k9:12.8,bb9:3.9,hr9:.7,h9:6.4,seed:91}
];
function hitRaw(p,idx){
  const r=rng(p.seed*100+idx);
  const pa=Math.round(p.pa*(1+.06*gauss(r)));
  const k=clamp(p.k*(1+.10*gauss(r)),.08,.35),bb=clamp(p.bb*(1+.12*gauss(r)),.05,.20),hr=clamp(p.hr*(1+.18*gauss(r)),.01,.09);
  const babip=p.babip+.02*gauss(r);
  const BB=Math.round(pa*bb),HBP=Math.round(pa*.01),SF=Math.round(pa*.007);
  const AB=pa-BB-HBP-SF,SO=Math.round(pa*k),HR=Math.round(pa*hr);
  const Hn=Math.round((AB-SO-HR)*babip);
  return {PA:pa,AB,H:HR+Hn,D2:Math.round(Hn*p.d2*(1+.15*gauss(r))),T3:Math.round(Hn*.02),HR,BB,HBP,SF,SO,SB:Math.max(0,Math.round(p.sb*(1+.25*gauss(r))))};
}
function pitRaw(p,idx){
  const r=rng(p.seed*100+idx);
  const outs=Math.round(p.ip*(1+.07*gauss(r))*3),ip=outs/3;
  const SO=Math.round(ip*p.k9*(1+.08*gauss(r))/9),BB=Math.round(ip*p.bb9*(1+.12*gauss(r))/9),HR=Math.round(ip*p.hr9*(1+.18*gauss(r))/9);
  const HBP=Math.round(ip*.3/9);
  const fip=(13*HR+3*(BB+HBP)-2*SO)/ip+3.10;
  return {outs,SO,BB,HR,HBP,ER:Math.round(ip*(fip+.45*gauss(r))/9),H:Math.round(ip*p.h9*(1+.06*gauss(r))/9)};
}
const KH=[
 {id:'k1',name:'김도윤',team:'한강 독수리',pos:'우익수',k:.17,bb:.10,hr:.050,babip:.325,d2:.23,sb:8,pa:600,seed:111},
 {id:'k2',name:'이준서',team:'남해 파도',pos:'유격수',k:.12,bb:.09,hr:.020,babip:.335,d2:.24,sb:25,pa:620,seed:122},
 {id:'k3',name:'박민재',team:'동해 고래',pos:'중견수',k:.16,bb:.09,hr:.030,babip:.335,d2:.21,sb:33,pa:610,seed:133},
 {id:'k4',name:'최현우',team:'백두 곰',pos:'1루수',k:.19,bb:.13,hr:.060,babip:.310,d2:.20,sb:2,pa:590,seed:144},
 {id:'k5',name:'정시우',team:'한강 독수리',pos:'3루수',k:.14,bb:.08,hr:.040,babip:.320,d2:.23,sb:10,pa:600,seed:155},
 {id:'k6',name:'한지호',team:'남해 파도',pos:'포수',k:.18,bb:.09,hr:.035,babip:.300,d2:.21,sb:3,pa:530,seed:166},
 {id:'k7',name:'서민기',team:'백두 곰',pos:'대타',k:.15,bb:.07,hr:.025,babip:.295,d2:.20,sb:2,pa:190,seed:171},
 {id:'k8',name:'문재우',team:'동해 고래',pos:'외야수',k:.13,bb:.10,hr:.070,babip:.350,d2:.20,sb:1,pa:110,seed:181}
];
const KP=[

function sampleDataset(lg){

/* ---------- 지표 계산 ---------- */
function hitStats(x,lg){
  const obp=(x.H+x.BB+x.HBP)/(x.AB+x.BB+x.HBP+x.SF);
  const slg=(x.H+x.D2+2*x.T3+3*x.HR)/x.AB;
  const ok=!!lg&&lg.obp>0&&lg.slg>0;
  return {pa:x.PA,team:x.T||'',opsp:ok?Math.round(100*(obp/lg.obp+slg/lg.slg-1)):null,avg:x.H/x.AB,obp,slg,ops:obp+slg,hr:x.HR,sb:x.SB==null?null:x.SB,bbp:x.PA>0?x.BB/x.PA:null,kp:x.SO==null||!(x.PA>0)?null:x.SO/x.PA,h:x.H};
}
function pitStats(x,lg){
  const ip=x.outs/3,hasSO=x.SO!=null,hasER=x.ER!=null;
  const fipOk=hasSO&&!!lg&&lg.cfip!=null;
  return {team:x.T||'',era:hasER?9*x.ER/ip:null,fip:fipOk?(13*x.HR+3*(x.BB+x.HBP)-2*x.SO)/ip+lg.cfip:null,whip:(x.H+x.BB)/ip,k9:hasSO?9*x.SO/ip:null,bb9:9*x.BB/ip,hr9:9*x.HR/ip,ip,so:hasSO?x.SO:null};
}
const r3=v=>v.toFixed(3).replace(/^0\./,'.');
const pct=v=>(v*100).toFixed(1)+'%';
const d2=v=>v.toFixed(2);
const inn=v=>{const o=Math.round(v*3);return Math.floor(o/3)+'.'+(o%3)};
const HM=[

const PM=[

const norm=(m,v)=>v==null?0:clamp((v-m.worst)/(m.best-m.worst),.04,1);
const fm=(m,v)=>(v==null||!isFinite(v))?'-':m.fmt(v);
// 기록이 없는 값(null)은 항상 맨 뒤로 보냅니다.
const better=(m,a,b)=>{const na=a==null||!isFinite(a),nb=b==null||!isFinite(b);if(na&&nb)return 0;if(na)return 1;if(nb)return -1;return m.lower?a-b:b-a;};

/* ---------- 데이터셋 로드 ---------- */
let SEASONS=[],H=[],P=[],DATA={},GAMES={},BYID=new Map(),RAW_MAIN=null,META={source:'sample'};
const coll=new Intl.Collator(undefined,{sensitivity:'base'});
function validate(ds){
  if(!ds||typeof ds!=='object')throw new Error('JSON 형식이 아닙니다.');
  if(!Array.isArray(ds.seasons)||!ds.seasons.length)throw new Error('seasons 항목이 없습니다.');
  if(!Array.isArray(ds.hitters)||!Array.isArray(ds.pitchers))throw new Error('hitters, pitchers 목록이 필요합니다.');
  if(!ds.hitters.length&&!ds.pitchers.length)throw new Error('선수가 한 명도 없습니다.');
  ds.hitters.concat(ds.pitchers).forEach(p=>{if(!p||p.id==null||!p.name||typeof p.raw!=='object'||!p.raw)throw new Error('선수 항목 형식이 맞지 않습니다: '+(p&&(p.name||p.id)));});
}
function loadDataset(ds){
  validate(ds);
  SEASONS=ds.seasons.map(Number).filter(Boolean).sort((a,b)=>a-b);
  GAMES={};SEASONS.forEach(y=>{const g=ds.league&&ds.league[y]?Number(ds.league[y].games):0;if(g>0)GAMES[y]=g;});
  // 그 시즌의 리그 기록이 있으면 그 값만 쓰고(없는 항목은 계산 불가), 아예 없으면 기본값을 씁니다.
  const lgOf=y=>{const l=ds.league&&ds.league[y];return l?{obp:l.obp,slg:l.slg,cfip:l.cfip}:{obp:.315,slg:.410,cfip:3.10};};
  DATA={};
  const mk=(arr,calc,ok,t)=>arr.map(p=>{
    const id=String(p.id),d={};
    SEASONS.forEach(y=>{const x=p.raw[y];if(x&&ok(x))d[y]=calc(x,lgOf(y));});
    DATA[id]=d;
    return {id,name:String(p.name),team:p.team||'',pos:p.pos||'',t};
  }).filter(p=>Object.keys(DATA[p.id]).length).sort((a,b)=>coll.compare(a.name,b.name));
  H=mk(ds.hitters,hitStats,x=>x.AB>0,'h');
  P=mk(ds.pitchers,pitStats,x=>x.outs>0,'p');
  BYID=new Map();H.concat(P).forEach(p=>BYID.set(p.id,p));
  const L=lgOf(SEASONS[SEASONS.length-1]);
  META={source:ds.source==='sample'?'sample':'real',generatedAt:ds.generatedAt||'',obp:L.obp,slg:L.slg,cfip:L.cfip};
  if(!H.length&&!P.length)throw new Error('계산할 수 있는 기록이 없습니다.');
}
// 최근 시즌 데이터 a와 과거 데이터 b를 선수 단위로 합칩니다(같은 시즌은 a가 우선).
function mergeDs(a,b){
  const seasons=Array.from(new Set((b.seasons||[]).concat(a.seasons||[]).map(Number))).sort((x,y)=>x-y);
  const league=Object.assign({},b.league||{},a.league||{});
  const comb=(la,lb)=>{
    const m=new Map();
    for(const e of lb||[])m.set(String(e.id),{id:String(e.id),name:e.name,team:e.team,pos:e.pos,raw:Object.assign({},e.raw)});
    for(const e of la||[]){
      const k=String(e.id),t=m.get(k);
      if(t){Object.assign(t.raw,e.raw);t.name=e.name||t.name;t.team=e.team||t.team;t.pos=e.pos||t.pos;}
      else m.set(k,{id:k,name:e.name,team:e.team,pos:e.pos,raw:Object.assign({},e.raw)});
    }
    return Array.from(m.values());
  };
  return {source:a.source,generatedAt:a.generatedAt,seasons,league,hitters:comb(a.hitters,b.hitters),pitchers:comb(a.pitchers,b.pitchers)};
}

const SC=['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];

const lst=()=>S.type==='hitter'?H:P;
const mets=()=>S.type==='hitter'?HM:PM;

function pool(y){

  return lst().filter(p=>(!S.team||teamOf(p,y||S.season)===S.team)&&(!S.favOnly||isFav(p.id))&&(!q||p.name.toLowerCase().includes(q))&&(!S.qualOnly||!y||isQual(p,y)));
}

function initSel(){

const dsKey=()=>'mlbstats.ds.'+S.league,favKey=()=>'mlbstats.fav.'+S.league,ctKey=()=>'mlbstats.contracts.'+S.league;
let CT={byId:new Map(),byName:new Map(),n:0};
const normName=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
const money=t=>{const v=String(t==null?'':t).trim();if(!v)return null;const x=Number(v.replace(/[$,\s원]/g,''));return Number.isFinite(x)?x:null;};
const usd=v=>v==null?'-':'$'+Math.round(v).toLocaleString('en-US');
function parseCsv(text){
  const rows=[];let row=[],cur='',q=false;
  const t=String(text).replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const CT_HDR={name:['이름','선수','선수명','name','player'],id:['선수id','id','mlbam','mlbamid'],year:['연도','시즌','year','season'],salary:['연봉','salary'],start:['계약시작','시작','start'],end:['계약종료','종료','만료','end'],total:['계약총액','총액','total'],note:['비고','메모','note']};
function loadContracts(text){
  const rows=parseCsv(text).filter(r=>r.some(c=>String(c).trim()));
  if(rows.length<2)throw new Error('CSV에 데이터 행이 없습니다.');
  const head=rows[0].map(h=>String(h).trim().toLowerCase().replace(/\s+/g,''));
  const ci={};for(const k in CT_HDR)ci[k]=head.findIndex(h=>CT_HDR[k].indexOf(h)>=0);
  if(ci.name<0&&ci.id<0)throw new Error('이름 또는 선수ID 열이 필요합니다.');
  if(ci.salary<0&&ci.total<0)throw new Error('연봉 또는 계약총액 열이 필요합니다.');
  const byId=new Map(),byName=new Map();let n=0;
  for(const r of rows.slice(1)){
    const g=k=>ci[k]>=0?String(r[ci[k]]==null?'':r[ci[k]]).trim():'';
    const rec={year:g('year'),salary:money(g('salary')),start:g('start'),end:g('end'),total:money(g('total')),note:g('note')};
    const id=g('id'),nn=normName(g('name'));
    if(!id&&!nn)continue;
    if(id){if(!byId.has(id))byId.set(id,[]);byId.get(id).push(rec);}
    if(nn){if(!byName.has(nn))byName.set(nn,[]);byName.get(nn).push(rec);}
    n++;
  }
  CT={byId,byName,n};
}
function contractsOf(p){return (CT.byId.get(p.id)||CT.byName.get(normName(p.name))||[]).slice().sort((a,b)=>String(a.year).localeCompare(String(b.year)));}
function contractHtml(p){

  }else{

  }
  return h+'</div>';
}

function enterLeague(lg){

  // 읽지 못하면(게시 페이지, 파일 직접 열기 등) 조용히 넘어가고 위의 데이터를 그대로 씁니다.

        return fetch('data/'+lg+'-history.json',{cache:'no-store'})
          .then(function(r){if(!r.ok)throw new Error('no history');return r.json();})
          .then(function(h){
            if(S.league!==lg)return;
            const merged=mergeDs(ds,h);
            const keep={season:S.season,pid:S.pid,tab:S.tab,type:S.type};

      .then(function(r){if(!r.ok)throw new Error('no csv');return r.text();})

      .catch(function(){});
  }catch(e){}
}

/* ---------- 차트 ---------- */
function radar(axes,series){
  const cx=170,cy=160,R=100,n=axes.length;
  const ang=i=>-Math.PI/2+2*Math.PI*i/n;
  const pt=(i,f)=>[(cx+Math.cos(ang(i))*R*f).toFixed(1),(cy+Math.sin(ang(i))*R*f).toFixed(1)];
  let s='<svg viewBox="0 0 340 320" role="img" aria-label="레이더 차트" class="chart">';
  [.25,.5,.75,1].forEach(f=>{s+='<polygon points="'+axes.map((_,i)=>pt(i,f).join(',')).join(' ')+'" fill="none" stroke="var(--line)"/>';});
  axes.forEach((a,i)=>{
    const e=pt(i,1);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--line)"/>';
    const l=pt(i,1.18),c=Math.cos(ang(i));
    s+='<text x="'+l[0]+'" y="'+(+l[1]+4)+'" text-anchor="'+(Math.abs(c)<.2?'middle':(c>0?'start':'end'))+'" class="axl">'+a+'</text>';
  });
  series.forEach(se=>{s+='<polygon points="'+se.vals.map((v,i)=>pt(i,v).join(',')).join(' ')+'" fill="'+se.color+'" fill-opacity=".14" stroke="'+se.color+'" stroke-width="2" stroke-linejoin="round"/>';});
  return s+'</svg>';
}
function lineChart(series,m,seasons){
  const W=360,Hh=230,l=44,r=14,t=16,b=28;
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null&&isFinite(v));
  if(!all.length)return '<p class="hint" style="text-align:center">이 지표는 선택한 선수들의 해당 시즌에 기록이 없습니다.</p>';
  let mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
  if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const N=Math.max(seasons.length-1,1);
  const X=i=>l+(W-l-r)*i/N,Y=v=>t+(Hh-t-b)*(1-(v-mn)/(mx-mn));
  let s='<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="시즌 추이 그래프" class="chart">';
  for(let k=0;k<4;k++){
    const v=mn+(mx-mn)*k/3,y=Y(v).toFixed(1);
    s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(l-6)+'" y="'+(+y+4)+'" text-anchor="end" class="axl">'+m.fmt(v)+'</text>';
  }
  const step=Math.max(1,Math.ceil(seasons.length/8));
  seasons.forEach((y,i)=>{if(i%step===0||i===seasons.length-1)s+='<text x="'+X(i)+'" y="'+(Hh-8)+'" text-anchor="middle" class="axl">'+y+'</text>';});
  series.forEach(se=>{
    let run=[];
    const flush=()=>{if(run.length>1)s+='<polyline fill="none" stroke="'+se.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+run.join(' ')+'"/>';run=[];};
    se.vals.forEach((v,i)=>{if(v==null||!isFinite(v)){flush();return;}run.push(X(i).toFixed(1)+','+Y(v).toFixed(1));});
    flush();
    const pr=seasons.length>40?2:3.5;
    se.vals.forEach((v,i)=>{if(v!=null&&isFinite(v))s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+pr+'" fill="'+se.color+'"/>';});
  });
  return s+'</svg>';
}

/* ---------- 컨트롤 조각 ---------- */
const teamOf=(p,y)=>{const d=DATA[p.id]&&DATA[p.id][y];return (d&&d.team)||p.team||'';};
const qlabel=()=>S.type==='hitter'?'규정 타석 이상':'규정 이닝 이상';
const seasonsOf=p=>Object.keys(DATA[p.id]||{}).map(Number).sort((a,b)=>a-b);
function badge(p,y){return isQual(p,y)?'<span class="bdg q">규정</span>':'<span class="bdg">미달</span>';}
function optHtml(p,val){const t=teamOf(p,S.season);return '<option value="'+esc(p.id)+'"'+(p.id===val?' selected':'')+'>'+esc(p.name)+(t?' ('+esc(t)+')':'')+'</option>';}
// 선수 목록을 '규정 이상'과 '규정 미달'로 나눠서 보여 줍니다.
function groupedOptions(list,val){
  const q=[],o=[];list.forEach(p=>(isQual(p,S.season)?q:o).push(p));
  let h='';
  if(q.length)h+='<optgroup label="'+qlabel()+' ('+q.length+'명)">'+q.map(p=>optHtml(p,val)).join('')+'</optgroup>';
  if(o.length)h+='<optgroup label="규정 미달 ('+o.length+'명)">'+o.map(p=>optHtml(p,val)).join('')+'</optgroup>';
  return h;
}
function selPlayer(key,val,list){return '<label class="lbl">선수<select data-act="set" data-key="'+key+'">'+groupedOptions(list,val)+'</select></label>';}
function selSeason(){
  return '<label class="lbl">시즌<select data-act="set" data-key="season">'+SEASONS.slice().reverse().map(y=>'<option value="'+y+'"'+(y===S.season?' selected':'')+'>'+y+'</option>').join('')+'</select></label>';
}
function selMetric(key,val){
  return '<label class="lbl">지표<select data-act="set" data-key="'+key+'">'+mets().map(m=>'<option value="'+m.k+'"'+(m.k===val?' selected':'')+'>'+m.label+'</option>').join('')+'</select></label>';
}
function picker(key,needSeason){
  const sel=S[key];
  let h='<div class="chips">'+sel.map((id,i)=>{
    const p=find(id);if(!p)return '';
    const miss=needSeason&&!has(p,S.season);
    return '<button class="chip'+(miss?' dim':'')+'" data-act="rm" data-key="'+key+'" data-id="'+esc(id)+'" aria-pressed="true" aria-label="'+esc(p.name)+' 빼기"><i style="background:'+SC[i]+'"></i>'+esc(p.name)+(miss?' (기록 없음)':'')+' ×</button>';
  }).join('')+'</div>';
  if(sel.length<4){
    const opts=pool(S.season).filter(p=>sel.indexOf(p.id)<0&&has(p,S.season));
    h+='<div class="controls"><label class="lbl">선수 추가 ('+sel.length+'/4) · '+S.season+' 시즌 선수 중에서<select data-act="add" data-key="'+key+'"><option value="">'+(opts.length?'선수를 고르세요':'추가할 선수가 없습니다')+'</option>'+groupedOptions(opts,'')+'</select></label></div>';
  }
  return h;
}
function filtersHtml(){
  const teams=Array.from(new Set(lst().filter(p=>has(p,S.season)).map(p=>teamOf(p,S.season)).filter(Boolean))).sort();
  const nfav=lst().filter(p=>isFav(p.id)).length;
  return '<div class="filters"><label class="lbl grow">선수 검색<input type="search" id="q" placeholder="이름을 입력하세요" value="'+esc(S.q)+'" autocomplete="off"></label><label class="lbl">팀<select data-act="set" data-key="team"><option value="">전체 팀</option>'+teams.map(t=>'<option value="'+esc(t)+'"'+(t===S.team?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label></div><div class="filters" style="margin-top:8px"><button class="chip" data-act="qual" aria-pressed="'+S.qualOnly+'">'+qlabel()+'만</button><button class="chip" data-act="favonly" aria-pressed="'+S.favOnly+'">★ 즐겨찾기만 ('+nfav+')</button></div><div class="count" id="count"></div>';
}
function updateCount(){
  const el=document.getElementById('count');if(!el)return;
  const all=lst().filter(p=>has(p,S.season));
  const nq=all.filter(p=>isQual(p,S.season)).length;
  el.textContent=S.season+' 시즌 · '+poolSeason().length+'명 표시 중 (전체 '+all.length+'명 = '+qlabel()+' '+nq+'명 + 규정 미달 '+(all.length-nq)+'명)';
}
function bannerHtml(){return '<div class="banner"><span>규정 미달 선수도 포함되어 있어요. 타율·OPS+·ERA 같은 비율 지표는 표본이 적은 선수가 위에 올 수 있습니다.</span><button class="chip" data-act="qualon">규정만 보기</button></div>';}
const emptyMsg='<div class="empty">조건에 맞는 선수가 없습니다. 팀, 검색어, 규정 필터를 바꿔 보세요.</div>';
const noRecMsg=m=>'<div class="empty">이 시즌에는 ‘'+m.label+'’ 기록이 없습니다. 옛 시즌에는 기록되지 않은 항목이 있습니다.</div>';

/* ---------- 화면 ---------- */
// 이 시즌에서 선수 p의 지표 m 순위. 비율 지표는 규정 이상 선수끼리만 매깁니다.
function rankOf(p,m,y){
  const v=DATA[p.id][y][m.k];
  if(v==null||!isFinite(v))return null;
  const base=lst().filter(q=>has(q,y)&&DATA[q.id][y][m.k]!=null&&(!m.rate||isQual(q,y)));
  if(!base.some(q=>q.id===p.id))return null;
  let r=1;
  for(const q of base){if(better(m,DATA[q.id][y][m.k],v)<0)r++;}
  return {r,n:base.length};
}
function ranksHtml(p){
  const y=S.season;
  return '<h2>이 선수의 스탯별 순위</h2><div class="ranks">'+mets().map(x=>{
    const k=rankOf(p,x,y);
    return '<div class="rk"><div class="n">'+x.label+'</div><div class="r">'+(k?k.r+'위':'-')+'</div><div class="of">'+(k?'/ '+k.n+'명':(DATA[p.id][y][x.k]==null?'기록 없음':'규정 미달'))+'</div></div>';
  }).join('')+'</div><p class="hint">비율 지표(OPS+, 타율, ERA 등)는 규정 타석·이닝 이상 선수끼리, 홈런·삼진 같은 누적 지표는 전체 선수 기준 순위입니다.</p>';
}
function vProfile(){
  const list=poolSeason();
  let h='<div class="controls">'+(list.length?selPlayer('pid',S.pid,list):'')+selSeason()+'</div>';
  const p=find(S.pid);
  if(!list.length||!p||!has(p,S.season))return h+emptyMsg;
  const m=mets(),d=DATA[p.id][S.season],fav=isFav(p.id);
  h+='<div class="who"><div><b>'+esc(p.name)+'</b><span>'+esc(joinDot([teamOf(p,S.season),p.pos]))+'</span>'+badge(p,S.season)+'</div><button class="favbtn" data-act="fav" data-id="'+esc(p.id)+'" aria-pressed="'+fav+'">'+(fav?'★ 즐겨찾기 해제':'☆ 즐겨찾기 추가')+'</button></div>';
  h+='<div class="board">'+m.map(x=>'<div class="cell'+(x.key?' key':'')+'"><div class="v">'+fm(x,d[x.k])+'</div><div class="n">'+x.label+'</div></div>').join('')+'</div>';
  h+=contractHtml(p);
  h+=ranksHtml(p);
  const bars=m.filter(x=>x.radar&&d[x.k]!=null);
  h+='<h2>기준 범위 안에서의 위치</h2><div class="card"><div class="bars">'+bars.map(x=>'<div class="bar"><span>'+x.label+'</span><div class="tr"><div class="fl" style="width:'+(norm(x,d[x.k])*100).toFixed(0)+'%"></div></div><span class="val">'+fm(x,d[x.k])+'</span></div>').join('')+'</div><p class="hint">막대가 길수록 좋은 수치입니다. 삼진 비율이나 ERA처럼 낮을수록 좋은 지표도 같은 방향으로 맞췄습니다.</p></div>';
  h+='<h2>시즌별 기록</h2><div class="card scroll"><table><thead><tr><th>시즌</th><th>팀</th>'+m.map(x=>'<th>'+x.label+'</th>').join('')+'</tr></thead><tbody>'+seasonsOf(p).map(y=>{const q=DATA[p.id][y];return '<tr'+(y===S.season?' class="on"':'')+'><td>'+y+'</td><td>'+esc(teamOf(p,y))+'</td>'+m.map(x=>'<td>'+fm(x,q[x.k])+'</td>').join('')+'</tr>';}).join('')+'</tbody></table></div>';
  return h;
}
function vCompare(){
  const m=mets();
  let h='<div class="controls">'+selSeason()+'</div><p class="hint" style="margin:0">최대 4명까지 고를 수 있습니다. 이름을 누르면 뺍니다.</p>'+picker('cmp',true);
  const ps=S.cmp.map((id,i)=>({p:find(id),c:SC[i]})).filter(o=>has(o.p,S.season));
  if(ps.length<2)return h+'<div class="empty">비교할 선수를 2명 이상 선택하세요.</div>';
  const val=(o,x)=>DATA[o.p.id][S.season][x.k];
  const rm=m.filter(x=>x.radar&&ps.every(o=>val(o,x)!=null));
  if(rm.length>=3){
    const series=ps.map(o=>({color:o.c,vals:rm.map(x=>norm(x,val(o,x)))}));
    h+='<div class="card" style="margin-top:12px">'+radar(rm.map(x=>x.label),series)+'<div class="legend">'+ps.map(o=>'<span><i style="background:'+o.c+'"></i>'+esc(o.p.name)+'</span>').join('')+'</div></div>';
  }else h+='<div class="empty">이 시즌에는 레이더 차트를 그릴 만큼 공통 기록이 없습니다. 아래 표를 보세요.</div>';
  h+='<h2>'+S.season+' 시즌 수치</h2><div class="card scroll"><table><thead><tr><th>지표</th>'+ps.map(o=>'<th>'+esc(short(o.p.name))+'</th>').join('')+'</tr></thead><tbody>'+m.map(x=>{
    const vals=ps.map(o=>val(o,x));
    const ok=vals.filter(v=>v!=null);
    const bestV=ok.length?(x.lower?Math.min.apply(null,ok):Math.max.apply(null,ok)):null;
    return '<tr><td>'+x.label+'</td>'+vals.map(v=>'<td'+(v!=null&&v===bestV?' class="best"':'')+'>'+fm(x,v)+'</td>').join('')+'</tr>';
  }).join('')+'</tbody></table></div><p class="hint">빨간색 굵은 글씨가 그 지표에서 가장 좋은 선수입니다. 기록이 없는 항목은 -로 표시합니다.</p>';
  return h;
}
function vTrend(){
  const m=mets().find(x=>x.k===S.tmetric)||mets()[0];
  let h='<div class="controls">'+selMetric('tmetric',m.k)+selSeason()+'</div><p class="hint" style="margin:0">최대 4명까지 고를 수 있습니다. 이름을 누르면 뺍니다. 선수의 전체 기록(데뷔~마지막 시즌)을 그립니다.</p>'+picker('trend',false);
  const ps=S.trend.map((id,i)=>({p:find(id),c:SC[i]})).filter(o=>o.p);
  if(!ps.length)return h+'<div class="empty">그래프에 표시할 선수를 선택하세요.</div>';
  const ys=[];ps.forEach(o=>seasonsOf(o.p).forEach(y=>ys.push(y)));
  const lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  const span=SEASONS.filter(y=>y>=lo&&y<=hi);
  const series=ps.map(o=>({color:o.c,vals:span.map(y=>has(o.p,y)?DATA[o.p.id][y][m.k]:null)}));
  h+='<div class="card" style="margin-top:12px">'+lineChart(series,m,span)+'<div class="legend">'+ps.map(o=>'<span><i style="background:'+o.c+'"></i>'+esc(o.p.name)+'</span>').join('')+'</div></div>';
  h+='<h2>'+m.label+' 연도별 값</h2><div class="card scroll"><table><thead><tr><th>선수</th>'+span.map(y=>'<th>'+y+'</th>').join('')+'</tr></thead><tbody>'+ps.map(o=>'<tr><td>'+esc(o.p.name)+'</td>'+span.map(y=>'<td>'+(has(o.p,y)?fm(m,DATA[o.p.id][y][m.k]):'-')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  return h;
}
function vRank(){
  const m=mets().find(x=>x.k===S.rmetric)||mets()[0];
  let h='<div class="controls">'+selMetric('rmetric',m.k)+selSeason()+'</div>';
  if(m.rate&&!S.qualOnly)h+=bannerHtml();
  const rows=poolSeason().map(p=>({p,v:DATA[p.id][S.season][m.k]})).filter(r=>r.v!=null&&isFinite(r.v)).sort((a,b)=>better(m,a.v,b.v));

  if(!rows.length)return h+noRecMsg(m);
  h+='<div class="rank">'+rows.slice(0,S.rankN).map((r,i)=>'<div class="row"><span class="no">'+(i+1)+'</span><div><div class="nm">'+esc(r.p.name)+(isFav(r.p.id)?' ★':'')+badge(r.p,S.season)+'</div><div class="tm">'+esc(joinDot([teamOf(r.p,S.season),r.p.pos]))+'</div></div><span class="rv">'+fm(m,r.v)+'</span><div class="gauge"><span style="width:'+(norm(m,r.v)*100).toFixed(0)+'%"></span></div></div>').join('')+'</div>';
  if(rows.length>S.rankN)h+='<button class="chip more" data-act="more">'+Math.min(20,rows.length-S.rankN)+'명 더 보기 (전체 '+rows.length+'명)</button>';
  h+='<p class="hint">'+(m.lower?'낮을수록 좋은 지표라 값이 작은 선수가 위에 옵니다.':'값이 큰 선수가 위에 옵니다.')+' 파란 “규정” 표시는 '+qlabel()+'인 선수입니다.</p>';

function vTop(){
  const m=mets();
  let h='<div class="controls">'+selSeason()+'</div>';

  if(!list.length)return h+emptyMsg;

    const rows=list.map(p=>({p,v:DATA[p.id][S.season][x.k]})).filter(r=>r.v!=null&&isFinite(r.v)).sort((a,b)=>better(x,a.v,b.v)).slice(0,5);
    return '<div class="topcard"><div class="th"><b>'+x.label+'</b><button class="link" data-act="tomet" data-m="'+x.k+'">전체 순위 ›</button></div>'+(rows.length?'<ol>'+rows.map((r,i)=>'<li><span class="no">'+(i+1)+'</span><span class="nm">'+esc(r.p.name)+badge(r.p,S.season)+'</span><span class="tm">'+esc(teamOf(r.p,S.season))+'</span><span class="v">'+fm(x,r.v)+'</span></li>').join('')+'</ol>':'<p class="hint">이 시즌에는 기록이 없습니다.</p>')+'</div>';
  }).join('')+'</div><p class="hint">스탯마다 상위 5명입니다. “전체 순위”를 누르면 그 스탯의 전체 순위표로 이동합니다.</p>';
  return h;
}
function sanitize(){
  if(S.team&&!lst().some(p=>has(p,S.season)&&teamOf(p,S.season)===S.team))S.team='';
  const ps=poolSeason();
  if(!ps.some(p=>p.id===S.pid))S.pid=ps[0]?ps[0].id:'';
  S.cmp=S.cmp.filter(id=>find(id));S.trend=S.trend.filter(id=>find(id));
}

  else if(a==='home'){S.league=null;}
  else if(a==='tab'){S.tab=t.dataset.v;}
  else if(a==='type'){if(S.type!==t.dataset.v){S.type=t.dataset.v;initSel();}}
  else if(a==='qual'){S.qualOnly=!S.qualOnly;}
  else if(a==='cclear'){CT={byId:new Map(),byName:new Map(),n:0};lsDel(ctKey());say('연봉·계약 자료를 지웠습니다.');}
  else if(a==='qualon'){S.qualOnly=true;}
  else if(a==='tomet'){S.rmetric=t.dataset.m;S.tab='rank';S.rankN=20;}
  else if(a==='rm'){S[t.dataset.key]=S[t.dataset.key].filter(id=>id!==t.dataset.id);}
  else if(a==='fav'){const id=t.dataset.id,i=S.fav.indexOf(id);if(i>=0)S.fav.splice(i,1);else S.fav.push(id);lsSet(favKey(),JSON.stringify(S.fav));}
  else if(a==='favonly'){S.favOnly=!S.favOnly;}
  else if(a==='more'){S.rankN+=20;}
  else if(a==='reset'){lsDel(dsKey());applyDataset(sampleDataset(S.league));say('샘플 데이터로 되돌렸습니다.');}
  else return;
  render();
});
// 이름 검색: 입력창은 그대로 두고 본문만 다시 그립니다(커서가 사라지지 않도록).
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){S.q=e.target.value;S.rankN=20;renderView();}
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.id==='cfile'){
    const cf=t.files&&t.files[0];if(!cf)return;
    const crd=new FileReader();
    crd.onerror=function(){say('파일을 읽지 못했습니다.',true);};
    crd.onload=function(){
      try{const text=String(crd.result);loadContracts(text);const saved=lsSet(ctKey(),text);render();say('연봉·계약 자료 '+CT.n+'건을 불러왔습니다.'+(saved?'':' (이 브라우저에는 저장하지 못했습니다)'));}
      catch(err){say('불러오지 못했습니다. '+err.message,true);}
      t.value='';
    };
    crd.readAsText(cf);
    return;
  }
  if(t.id==='file'){
    const f=t.files&&t.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onerror=function(){say('파일을 읽지 못했습니다.',true);};
    rd.onload=function(){
      try{
        const text=String(rd.result),ds=JSON.parse(text);
        applyDataset(ds);
        const saved=lsSet(dsKey(),text);
        render();
        say(saved?'불러왔습니다. 이 브라우저에 저장해서 다시 열어도 유지됩니다.':'불러왔습니다. 이 브라우저에는 저장하지 못해 새로고침하면 사라집니다.');
      }catch(err){
        say('불러오지 못했습니다. '+err.message,true);
      }
      t.value='';
    };
    rd.readAsText(f);
    return;
  }
  const act=t.dataset&&t.dataset.act;
  if(act==='set'){const k=t.dataset.key;S[k]=k==='season'?parseInt(t.value,10):t.value;render();}
  else if(act==='add'){const k=t.dataset.key;if(t.value&&S[k].length<4&&S[k].indexOf(t.value)<0)S[k].push(t.value);render();}
});

/* ---------- 시작 ---------- */
render(); // 첫 화면: 리그 선택
window.__mlb={enterLeague,render,S};
})();
</script>
