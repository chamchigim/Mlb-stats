<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLB 스탯 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2EF; --panel:#FFFFFF; --ink:#13241D; --mute:#5B6B63; --line:#D3DCD6;
  --board:#12261F; --board-ink:#C9D8CE; --bulb:#F5C542;
  --accent:#D8343B; --s1:#D8343B; --s2:#1F7AA8; --s3:#B87F00; --s4:#7A4FB5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A15; --panel:#14281F; --ink:#E6EEE8; --mute:#93A59B; --line:#274236;
    --board:#091510; --board-ink:#A9BDB0; --bulb:#F5C542;
    --accent:#FF6B70; --s1:#FF6B70; --s2:#5BB8E8; --s3:#F0B429; --s4:#B79BEB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A15; --panel:#14281F; --ink:#E6EEE8; --mute:#93A59B; --line:#274236;
  --board:#091510; --board-ink:#A9BDB0; --bulb:#F5C542;
  --accent:#FF6B70; --s1:#FF6B70; --s2:#5BB8E8; --s3:#F0B429; --s4:#B79BEB;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-family:"Barlow Condensed","Noto Sans KR",sans-serif;font-weight:700;font-size:30px;letter-spacing:.01em;line-height:1.1}
.sub{margin:4px 0 0;color:var(--mute);font-size:13px}
.top{display:flex;flex-direction:column;gap:14px;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel);align-self:flex-start}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-weight:500;padding:6px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:500;padding:10px 0;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
button:focus-visible,select:focus-visible,.filebtn:focus-within{outline:2px solid var(--s2);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:16px 0 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 14px;align-items:flex-end}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
.lbl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);min-width:0}
.who{margin:6px 0 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who b{font-size:20px}
.who span{color:var(--mute);font-size:14px;margin-left:6px}
.favbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.favbtn[aria-pressed="true"]{border-color:var(--bulb);background:rgba(245,197,66,.16)}
/* scoreboard */
.board{background:var(--board);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.cell{border:1px solid rgba(201,216,206,.22);border-radius:8px;padding:8px 6px 6px;text-align:center}
.cell .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;line-height:1.05;color:var(--bulb);font-variant-numeric:tabular-nums}
.cell .n{font-size:11px;color:var(--board-ink);margin-top:2px}
.cell.key{grid-column:span 2;background:rgba(245,197,66,.08);border-color:rgba(245,197,66,.5)}
.cell.key .v{font-size:48px}
h2{font-size:15px;margin:26px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--mute);margin-top:14px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:64px 1fr 52px;align-items:center;gap:10px;font-size:13px}
.bar .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--s2);border-radius:4px}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
th{color:var(--mute);font-weight:500}
tr.on td{background:rgba(245,197,66,.14)}
td.best{font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip.dim{color:var(--mute);border-style:dashed}
.chart{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.axl{font-size:11px;fill:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.rank{display:grid;gap:8px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row .no{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--mute)}
.row:first-child .no{color:var(--accent)}
.row .nm{font-weight:500}
.row .tm{font-size:12px;color:var(--mute)}
.row .rv{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.row .gauge{grid-column:2 / 4;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:-2px}
.row .gauge span{display:block;height:100%;background:var(--s2)}
.more{margin-top:12px}
.note{margin-top:14px;font-size:12px;color:var(--mute);line-height:1.6}
.tag{display:inline-block;font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:2px 8px;margin-top:8px}
.data{margin-top:34px}
.data h2{margin-top:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filebtn{position:relative;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.msg{font-size:13px;margin-top:10px;min-height:1.2em}
.msg.err{color:var(--accent)}
[hidden]{display:none!important}
.back{border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;padding:0;cursor:pointer;align-self:flex-start}
.back:hover{color:var(--ink)}
.land{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:24px}
.land h1{font-size:42px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pick{border:1px solid rgba(201,216,206,.22);background:var(--board);border-radius:16px;padding:28px 20px 22px;text-align:center;cursor:pointer;font:inherit}
.pick:hover{border-color:var(--bulb)}
.pick:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.pick .big{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:88px;line-height:1;color:var(--bulb);letter-spacing:.02em}
.pick .ko{display:block;margin-top:10px;font-size:16px;color:#EAF1E8}
input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.grow{flex:1 1 180px}
.count{font-size:12px;color:var(--mute);margin:8px 0 0}
.banner{background:rgba(245,197,66,.14);border:1px solid rgba(245,197,66,.45);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.topcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.topcard .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.topcard .th b{font-size:15px}
.link{border:0;background:transparent;color:var(--s2);font:inherit;font-size:12px;cursor:pointer;padding:0}
.topcard ol{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.topcard li{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:8px;align-items:baseline;font-size:13px}
.topcard li .no{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--mute)}
.topcard li:first-child .no{color:var(--accent)}
.topcard li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topcard li .tm{color:var(--mute);font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topcard li .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.rk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.rk .n{font-size:11px;color:var(--mute)}
.rk .r{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;line-height:1.1}
.rk .of{font-size:11px;color:var(--mute)}
.tabs{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;padding:10px 14px;font-size:14px}
.scope{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:3px;background:var(--panel)}
.scope button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:11px;cursor:pointer}
.scope button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tl{border:0;background:transparent;color:var(--s2);font:inherit;cursor:pointer;padding:0;text-align:left}
.tl:hover{text-decoration:underline}
.stand h3{font-size:14px;margin:14px 0 6px}
.salgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-bottom:8px}
.salgrid div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--mute)}
.salgrid b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.tlogo{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}
.tlogo.lg{width:30px;height:30px}
.tlogo.xl{width:54px;height:54px;margin:0 10px 0 0}
.cell .k{margin-top:5px;font-size:13px;font-weight:700;color:#fff;background:rgba(245,197,66,.22);border-radius:6px;padding:1px 4px}
.cell .k small{font-weight:500;color:var(--board-ink);font-size:11px}
.cell .k.off{background:none;color:var(--board-ink);font-weight:500;font-size:11px}
.bk{position:relative;margin:0 auto}
.bkh{position:absolute;height:28px;line-height:28px;text-align:center;color:#fff;font-weight:700;font-size:13px}
.bkh.al,.pc.al .pch,.pc.al .pcd{background:#E31B4C}
.bkh.nl,.pc.nl .pch,.pc.nl .pcd{background:#0B4A8F}
.bkh:not(.al):not(.nl){background:#5B6B63}
.pc{position:absolute;width:172px;box-sizing:border-box;overflow:hidden;border:2px solid #5B6B63;background:#fff;color:#111}
.pc.al{border-color:#E31B4C}.pc.nl{border-color:#0B4A8F}.pc.ws{border-color:#0B2A55}
.pch{height:22px;line-height:22px;text-align:center;font-size:12px;font-weight:700;color:#fff;background:#5B6B63}
.pc.ws .pch,.pc.ws .pcd{background:#0B2A55}
.pcr{display:flex;height:38px;border-top:1px solid #d6dbd8;overflow:hidden}
.pcr .ab{flex:0 0 62px;width:62px;box-sizing:border-box;background:#0B2A55;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;overflow:hidden}
.pcr .ab b{font-size:14px}.pcr .ab small{font-size:10px;color:#FFA463}
.pcr .lgc{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;background:#fff}
.pcr .lgc .tlogo{margin:0;width:28px;height:28px}
.pcr .scr{flex:0 0 44px;width:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:#fff;color:#111}
.pcr .scr.w{background:#FFD400}
.pcd{height:22px;line-height:22px;text-align:center;font-size:11px;color:#fff;background:#5B6B63}
.champban{background:var(--board);color:#EAF1E8;border-radius:14px;padding:18px 16px;text-align:center;margin-bottom:6px}
.champban .cy{font-size:13px;letter-spacing:.02em;color:var(--board-ink)}
.champban .cn{font-family:"Barlow Condensed","Noto Sans KR",sans-serif;font-weight:700;font-size:44px;line-height:1.1;color:var(--bulb);margin:2px 0}
.champban .cs{font-size:13px;color:var(--board-ink)}
.pbd{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.pcol h3{font-size:15px;margin:0 0 8px;padding-bottom:6px;border-bottom:3px solid var(--ink)}
.pr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:1px 10px;align-items:center;padding:8px 10px;border-radius:10px;margin-bottom:6px;border-left:7px solid var(--line);background:var(--panel)}
.pr.dw{border-left-color:var(--bulb);background:rgba(245,197,66,.16)}
.pr.wc{border-left-color:var(--s2);background:rgba(31,122,168,.14)}
.pr.champ{outline:2px solid var(--bulb)}
.pr .sd{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;line-height:1;text-align:center}
.pr .tn{font-weight:700;font-size:15px}
.pr .tn .tl{font-size:15px;font-weight:700;color:var(--ink)}
.pr .rc{grid-column:2 / 4;font-size:12px;color:var(--mute)}
.pr .rc b{color:var(--ink)}
.tg{font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.tg.dw{background:var(--bulb);color:#13241D}
.tg.wc{background:var(--s2);color:#fff}
.dvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dvc{background:var(--board);color:#EAF1E8;border-radius:12px;padding:10px 12px}
.dvc .t{font-size:11px;color:var(--board-ink)}
.dvc .n .tl{font-size:17px;font-weight:700;color:var(--bulb)}
.dvc .r{font-size:12px;color:var(--board-ink)}
.wc tr.in td{background:rgba(31,122,168,.14);font-weight:700}
.wc tr.cut td{border-bottom:3px solid var(--s2)}
.wc tr.out td{color:var(--mute)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcol .bh{font-size:13px;margin:0 0 4px;padding:4px 8px;border-radius:8px;background:var(--ink);color:var(--bg);text-align:center}
.bcol .rt{font-size:11px;color:var(--mute);margin:10px 0 2px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:5px 0;overflow:hidden}
.sr{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font-size:13px;color:var(--mute)}
.sr .tl{color:inherit;font-size:13px}
.sr.win{background:rgba(245,197,66,.24);color:var(--ink);font-weight:700}
.bfinal{margin-top:10px}
.bfinal .sc{border:2px solid var(--bulb)}
.bt{font-size:12px;fill:var(--ink)}
.bt.win{font-weight:700}
.bt.lose{fill:var(--mute)}
.bw{font-size:12px;fill:var(--ink);font-variant-numeric:tabular-nums}
.bw.win{font-weight:700}
.bw.lose{fill:var(--mute)}
.bhd{font-size:11px;fill:var(--mute)}
.awgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.awcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.awcard h3{font-size:14px;margin:0 0 8px}
.awr{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:2px 0;flex-wrap:wrap}
.lgt{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mute)}
.awr .tm{font-size:12px;color:var(--mute)}
.bdg{display:inline-block;font-size:10px;line-height:1.5;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--mute);vertical-align:middle;white-space:nowrap}
.bdg.q{color:var(--s2);border-color:var(--s2)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;color:var(--s2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none}
.filebtn.alt{background:transparent;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <section class="land" id="landing" hidden>
    <div>
      <h1>야구 스탯 분석</h1>
      <p class="sub">세이버메트릭스로 선수를 보고, 비교하고, 순위를 매깁니다. 리그를 먼저 고르세요.</p>
    </div>
    <div class="picks">
      <button class="pick" data-act="league" data-v="kbo"><span class="big">KBO</span><span class="ko">한국프로야구</span></button>
      <button class="pick" data-act="league" data-v="mlb"><span class="big">MLB</span><span class="ko">메이저리그</span></button>
    </div>
  </section>
  <div id="shell" hidden>
  <div class="top">
    <button class="back" data-act="home">← 리그 선택</button>
    <div>
      <h1 id="title">MLB 스탯 분석</h1>
      <p class="sub">세이버메트릭스로 선수를 보고, 비교하고, 순위를 매깁니다.</p>
      <span class="tag" id="tag"></span>
    </div>
    <div class="seg" role="group" aria-label="선수 유형" id="seg"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div id="filters"></div>
  <main id="app"></main>

  <section class="data card">
    <h2>데이터</h2>
    <div id="datastatus"></div>
    <div class="btns">
      <label class="filebtn">JSON 파일 불러오기<input type="file" id="file" accept="application/json,.json"></label>
      <button class="chip" id="resetbtn" data-act="reset">샘플로 되돌리기</button>
    </div>
    <div id="ctbox"><div class="btns">
      <label class="filebtn alt">연봉·계약 CSV 불러오기<input type="file" id="cfile" accept=".csv,text/csv"></label>
      <button class="chip" id="cclear" data-act="cclear">연봉·계약 자료 지우기</button>

  ranked=ranked.sort((a,b)=>better(m,DATA[a.id][y][m.k],DATA[b.id][y][m.k]));
  S.q='';
  S.pid=ranked[0]?ranked[0].id:'';
  S.cmp=ranked.slice(0,3).map(p=>p.id);S.trend=S.cmp.slice();
  S.tmetric=m.k;S.rmetric=m.k;S.rankN=20;
}

const normName=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
const money=t=>{const v=String(t==null?'':t).trim();if(!v)return null;const x=Number(v.replace(/[$,\s원]/g,''));return Number.isFinite(x)?x:null;};
const usd=v=>v==null?'-':'$'+Math.round(v).toLocaleString('en-US');
function parseCsv(text){
  const rows=[];let row=[],cur='',q=false;
  const t=String(text).replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const CT_HDR={name:['이름','선수','선수명','name','player'],id:['선수id','id','mlbam','mlbamid'],year:['연도','시즌','year','season'],salary:['연봉','salary'],start:['계약시작','시작','start'],end:['계약종료','종료','만료','end'],total:['계약총액','총액','total'],note:['비고','메모','note']};
function loadContracts(text){
  const rows=parseCsv(text).filter(r=>r.some(c=>String(c).trim()));
  if(rows.length<2)throw new Error('CSV에 데이터 행이 없습니다.');
  const head=rows[0].map(h=>String(h).trim().toLowerCase().replace(/\s+/g,''));
  const ci={};for(const k in CT_HDR)ci[k]=head.findIndex(h=>CT_HDR[k].indexOf(h)>=0);
  if(ci.name<0&&ci.id<0)throw new Error('이름 또는 선수ID 열이 필요합니다.');
  if(ci.salary<0&&ci.total<0)throw new Error('연봉 또는 계약총액 열이 필요합니다.');
  const byId=new Map(),byName=new Map();let n=0;
  for(const r of rows.slice(1)){
    const g=k=>ci[k]>=0?String(r[ci[k]]==null?'':r[ci[k]]).trim():'';
    const rec={year:g('year'),salary:money(g('salary')),start:g('start'),end:g('end'),total:money(g('total')),note:g('note')};
    const id=g('id'),nn=normName(g('name'));
    if(!id&&!nn)continue;
    if(id){if(!byId.has(id))byId.set(id,[]);byId.get(id).push(rec);}
    if(nn){if(!byName.has(nn))byName.set(nn,[]);byName.get(nn).push(rec);}
    n++;
  }
  CT={byId,byName,n};
}

function radar(axes,series){
  const cx=170,cy=160,R=100,n=axes.length;
  const ang=i=>-Math.PI/2+2*Math.PI*i/n;
  const pt=(i,f)=>[(cx+Math.cos(ang(i))*R*f).toFixed(1),(cy+Math.sin(ang(i))*R*f).toFixed(1)];
  let s='<svg viewBox="0 0 340 320" role="img" aria-label="레이더 차트" class="chart">';
  [.25,.5,.75,1].forEach(f=>{s+='<polygon points="'+axes.map((_,i)=>pt(i,f).join(',')).join(' ')+'" fill="none" stroke="var(--line)"/>';});
  axes.forEach((a,i)=>{
    const e=pt(i,1);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--line)"/>';
    const l=pt(i,1.18),c=Math.cos(ang(i));
    s+='<text x="'+l[0]+'" y="'+(+l[1]+4)+'" text-anchor="'+(Math.abs(c)<.2?'middle':(c>0?'start':'end'))+'" class="axl">'+a+'</text>';
  });
  series.forEach(se=>{s+='<polygon points="'+se.vals.map((v,i)=>pt(i,v).join(',')).join(' ')+'" fill="'+se.color+'" fill-opacity=".14" stroke="'+se.color+'" stroke-width="2" stroke-linejoin="round"/>';});
  return s+'</svg>';
}
function lineChart(series,m,seasons){
  const W=360,Hh=230,l=44,r=14,t=16,b=28;
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null&&isFinite(v));
  if(!all.length)return '<p class="hint" style="text-align:center">이 지표는 선택한 선수들의 해당 시즌에 기록이 없습니다.</p>';
  let mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
  if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const N=Math.max(seasons.length-1,1);
  const X=i=>l+(W-l-r)*i/N,Y=v=>t+(Hh-t-b)*(1-(v-mn)/(mx-mn));
  let s='<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="시즌 추이 그래프" class="chart">';
  for(let k=0;k<4;k++){
    const v=mn+(mx-mn)*k/3,y=Y(v).toFixed(1);
    s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(l-6)+'" y="'+(+y+4)+'" text-anchor="end" class="axl">'+m.fmt(v)+'</text>';
  }
  const step=Math.max(1,Math.ceil(seasons.length/8));
  seasons.forEach((y,i)=>{if(i%step===0||i===seasons.length-1)s+='<text x="'+X(i)+'" y="'+(Hh-8)+'" text-anchor="middle" class="axl">'+y+'</text>';});
  series.forEach(se=>{
    let run=[];
    const flush=()=>{if(run.length>1)s+='<polyline fill="none" stroke="'+se.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+run.join(' ')+'"/>';run=[];};
    se.vals.forEach((v,i)=>{if(v==null||!isFinite(v)){flush();return;}run.push(X(i).toFixed(1)+','+Y(v).toFixed(1));});
    flush();
    const pr=seasons.length>40?2:3.5;
    se.vals.forEach((v,i)=>{if(v!=null&&isFinite(v))s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+pr+'" fill="'+se.color+'"/>';});
  });
  return s+'</svg>';
}

// 이 시즌에서 선수 p의 지표 m 순위. 비율 지표는 규정 이상 선수끼리만 매깁니다.
function rankOf(p,m,y){
  const v=DATA[p.id][y][m.k];
  if(v==null||!isFinite(v))return null;
  const base=lst().filter(q=>has(q,y)&&DATA[q.id][y][m.k]!=null&&(!m.rate||isQual(q,y)));
  if(!base.some(q=>q.id===p.id))return null;
  let r=1;
  for(const q of base){if(better(m,DATA[q.id][y][m.k],v)<0)r++;}
  return {r,n:base.length};
}
function ranksHtml(p){
  const y=S.season;
  return '<h2>이 선수의 스탯별 순위</h2><div class="ranks">'+mets().map(x=>{
    const k=rankOf(p,x,y);
    return '<div class="rk"><div class="n">'+x.label+'</div><div class="r">'+(k?k.r+'위':'-')+'</div><div class="of">'+(k?'/ '+k.n+'명':(DATA[p.id][y][x.k]==null?'기록 없음':'규정 미달'))+'</div></div>';

}

  h+='<h2>투수 최종 기록 ('+rp.length+'명)</h2><div class="card scroll"><table><thead><tr><th>선수</th><th>구분</th><th>이닝</th><th>ERA</th><th>FIP</th><th>WHIP</th><th>K/9</th><th>삼진</th>'+(SHOW_SAL?'<th>연봉</th>':'')+'</tr></thead><tbody>'+rp.map(p=>{const d=DATA[p.id][y];return '<tr><td>'+pLink(p)+'</td><td>'+badge(p,y)+'</td><td>'+FM(PM,'ip',d.ip)+'</td><td>'+FM(PM,'era',d.era)+'</td><td>'+FM(PM,'fip',d.fip)+'</td><td>'+FM(PM,'whip',d.whip)+'</td><td>'+FM(PM,'k9',d.k9)+'</td><td>'+FM(PM,'so',d.so)+'</td>'+(SHOW_SAL?'<td>'+sal(p)+'</td>':'')+'</tr>';}).join('')+'</tbody></table></div>';

const roundKo2=o=>['와일드카드','디비전시리즈','챔피언십시리즈','월드시리즈'][o]||'';
const shortTeam=n=>{const w=String(n).trim().split(/\s+/);const l=w[w.length-1];return (/^(Sox|Jays)$/i.test(l)&&w.length>1)?w[w.length-2]+' '+l:l;};
const splitScore=sc=>{const m=String(sc).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:[null,null];};
function leagueMap(y){
  const m=new Map(),ex=EXTRAS&&EXTRAS.seasons&&EXTRAS.seasons[y];
  if(!ex)return m;
  for(const d of ex.standings||[]){const lg=/american/i.test(d.lg)?'AL':/national/i.test(d.lg)?'NL':'';if(!lg)continue;for(const t of d.teams)m.set(t.n,lg);}

// 포스트시즌 대진표(사다리): 왼쪽 AL, 가운데 월드시리즈, 오른쪽 NL
function bracketHtml(y){
  const ex=EXTRAS&&EXTRAS.seasons&&EXTRAS.seasons[y];
  const post=(ex&&ex.post)||[];
  if(!post.length)return '';
  const ser=post.map(r=>{const sc=splitScore(r.score);return {r,ord:r.ord!=null?r.ord:3,w:r.w,l:r.l,ww:sc[0],lw:sc[1]};});
  const BW=140,BH=46,CG=30,RG=14,PAD=8,HD=22;
  const ws=ser.filter(x=>x.ord===3).pop()||null;
  const rest=ser.filter(x=>x!==ws);
  const par=new Map();
  const root=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
  rest.forEach(x=>{[x.w,x.l].forEach(t=>{if(!par.has(t))par.set(t,t);});const a=root(x.w),b=root(x.l);if(a!==b)par.set(a,b);});
  const groups=new Map();rest.forEach(x=>{const g=root(x.w);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(x);});
  const lgm=leagueMap(y);
  const sides=Array.from(groups.values()).map(list=>{const v={AL:0,NL:0};list.forEach(x=>[x.w,x.l].forEach(t=>{const g=lgm.get(t);if(g)v[g]++;}));return {list,lg:v.AL>v.NL?'AL':(v.NL>v.AL?'NL':'')};});
  sides.sort((a,b)=>(a.lg==='AL'?0:a.lg==='NL'?2:1)-(b.lg==='AL'?0:b.lg==='NL'?2:1));
  const lay=side=>{
    if(!side)return {nodes:[],cols:0,leaves:0,top:null,ords:[],lg:''};
    const list=side.list,used=new Set(),ords=Array.from(new Set(list.map(x=>x.ord))).sort((a,b)=>a-b);
    let slot=0;const nodes=[];
    const build=x=>{
      used.add(x);const kids=[];
      for(const t of [x.w,x.l]){const f=list.filter(z=>!used.has(z)&&z.ord<x.ord&&z.w===t).sort((a,b)=>b.ord-a.ord)[0];if(f)kids.push(build(f));}
      const yy=kids.length?kids.reduce((a,k)=>a+k.y,0)/kids.length:slot++;
      const nd={s:x,kids,y:yy,col:ords.indexOf(x.ord)};nodes.push(nd);return nd;
    };
    const tops=[];list.slice().sort((a,b)=>b.ord-a.ord).forEach(x=>{if(!used.has(x))tops.push(build(x));});
    return {nodes,cols:ords.length,leaves:Math.max(slot,1),top:tops[0]||null,ords,lg:side.lg};
  };
  const L=lay(sides[0]),R=lay(sides[1]);
  const rows=Math.max(L.leaves,R.leaves,1);
  const H=HD+rows*(BH+RG)-RG+PAD;
  const W=PAD*2+L.cols*(BW+CG)+BW+R.cols*(BW+CG);
  const lx=c=>PAD+c*(BW+CG), rx=c=>W-PAD-BW-c*(BW+CG);
  const py=nd=>HD+nd.y*(BH+RG);
  const cx=PAD+L.cols*(BW+CG);
  const tops=[L.top,R.top].filter(Boolean);
  const wsY=HD+(tops.length?tops.reduce((a,t)=>a+t.y,0)/tops.length:0)*(BH+RG);
  const box=(x,yy,x0,champ)=>{
    const sx=x0.s;
    const row=(n,wins,ty,cls)=>'<g data-act="team" data-t="'+esc(n)+'" data-y="'+y+'" style="cursor:pointer"><text x="'+(x+8)+'" y="'+ty+'" class="bt '+cls+'">'+esc(shortTeam(n))+'</text></g><text x="'+(x+BW-8)+'" y="'+ty+'" class="bw '+cls+'" text-anchor="end">'+(wins==null?'':wins)+'</text>';
    return '<rect x="'+x+'" y="'+yy+'" width="'+BW+'" height="'+BH+'" rx="6" style="fill:var(--panel);stroke:'+(champ?'var(--bulb)':'var(--line)')+';stroke-width:'+(champ?2.5:1)+'"/><rect x="'+(x+1)+'" y="'+(yy+1)+'" width="'+(BW-2)+'" height="'+(BH/2-1)+'" rx="5" style="fill:rgba(245,197,66,.22)"/>'+row(sx.w,sx.ww,yy+19,'win')+row(sx.l,sx.lw,yy+39,'lose');
  };
  let g='',hd='';
  const drawSide=(Ls,mirror)=>{
    const X=c=>mirror?rx(c):lx(c);
    Ls.nodes.forEach(nd=>{
      nd.kids.forEach(k=>{
        const kx=X(k.col),nx=X(nd.col),ky=py(k)+BH/2,ny=py(nd)+BH/2;
        const x1=mirror?kx:kx+BW,x2=mirror?nx+BW:nx,mid=mirror?kx-CG/2:kx+BW+CG/2;
        g+='<path d="M'+x1+','+ky+' H'+mid+' V'+ny+' H'+x2+'" style="fill:none;stroke:var(--line);stroke-width:1.5"/>';
      });
    });
    Ls.nodes.forEach(nd=>{g+=box(X(nd.col),py(nd),nd,false);});
    Ls.ords.forEach((o,i)=>{hd+='<text x="'+(X(i)+BW/2)+'" y="14" text-anchor="middle" class="bhd">'+(Ls.lg?Ls.lg+' ':'')+roundKo2(o)+'</text>';});
    if(Ls.top){
      const t=Ls.top,x1=mirror?X(t.col):X(t.col)+BW,x2=mirror?cx+BW:cx,mid=mirror?(X(t.col)+cx+BW)/2:(X(t.col)+BW+cx)/2;
      if(ws)g+='<path d="M'+x1+','+(py(t)+BH/2)+' H'+mid+' V'+(wsY+BH/2)+' H'+x2+'" style="fill:none;stroke:var(--line);stroke-width:1.5"/>';
    }
  };
  drawSide(L,false);drawSide(R,true);
  if(ws){g+=box(cx,wsY,{s:ws},true);hd+='<text x="'+(cx+BW/2)+'" y="14" text-anchor="middle" class="bhd">월드시리즈</text>';}
  return '<h2>'+y+' 포스트시즌 대진표</h2>'+(ws?'<p style="margin:0 0 8px">월드시리즈 우승 <b>'+esc(ws.w)+'</b> ('+esc(ws.r.score)+')</p>':'')+'<div class="card scroll"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="포스트시즌 대진표" style="display:block;min-width:'+W+'px">'+hd+g+'</svg></div><p class="hint">굵은 글씨·노란 줄이 이긴 팀이고 오른쪽 숫자는 시리즈 승수입니다. 왼쪽이 아메리칸리그, 오른쪽이 내셔널리그입니다(구분이 안 되는 시즌은 순서대로 놓았습니다). 팀 이름을 누르면 그 팀의 선수 기록으로 이동합니다.</p>';
}

const lgCode=(lg,dv)=>{const t=(lg||'')+' '+(dv||'');return /american|\bAL\b/i.test(t)?'AL':(/national|\bNL\b/i.test(t)?'NL':'');};
const lgKo=c=>c==='AL'?'아메리칸리그':c==='NL'?'내셔널리그':'리그';
const dvShort=dv=>/east/i.test(dv)?'동부':/central/i.test(dv)?'중부':/west/i.test(dv)?'서부':'';
const dvKo=(lg,dv)=>(lgKo(lgCode(lg,dv))+' '+dvShort(dv)).trim();
const byPct=(a,b)=>(parseFloat(b.pct)||0)-(parseFloat(a.pct)||0)||b.w-a.w;
function postModel(y){
  const ex=EXTRAS&&EXTRAS.seasons&&EXTRAS.seasons[y];
  if(!ex||!(ex.standings||[]).length)return null;
  const post=ex.post||[];
  const teams=[];
  for(const d of ex.standings){const lg=lgCode(d.lg,d.dv);for(const t of d.teams)teams.push(Object.assign({},t,{lg,dv:d.dv||'',dlg:d.lg||''}));}
  const inPost=new Map();
  post.forEach(sr=>{[sr.w,sr.l].forEach(n=>{if(!inPost.has(n))inPost.set(n,[]);inPost.get(n).push(sr);});});
  const exitOf=n=>{
    const l=inPost.get(n);if(!l)return '';
    const f=l.slice().sort((a,b)=>b.ord-a.ord)[0];
    if(f.ord===3)return f.w===n?'월드시리즈 우승':'월드시리즈 준우승';
    return roundKo2(f.ord)+(f.l===n?' 탈락':' 승리');
  };
  const lgs={};
  for(const lg of ['AL','NL']){
    const T=teams.filter(t=>t.lg===lg);
    if(!T.length)continue;
    const hasDv=T.some(t=>t.dv);
    // 지구 우승팀: 지구마다 우승 표시가 있는 팀(없으면 그 지구 1위). 지구가 없던 시기는 리그 1위.
    let dw;
    if(hasDv){
      dw=[];
      for(const d of ex.standings){
        if(lgCode(d.lg,d.dv)!==lg||!d.dv)continue;
        const w=d.teams.find(t=>t.champ)||d.teams.find(t=>t.rank===1);
        const full=w&&T.find(t=>t.n===w.n&&t.dv===(d.dv||''));
        if(full)dw.push(full);
      }
      dw.sort(byPct);
    }else dw=T.filter(t=>t.rank===1).sort(byPct);
    const dwSet=new Set(dw.map(t=>t.n));
    lgs[lg]={T,hasDv,dw,wc:T.filter(t=>!dwSet.has(t.n)&&inPost.has(t.n)).sort(byPct),rest:T.filter(t=>!dwSet.has(t.n)).sort(byPct)};
  }
  return {lgs,inPost,exitOf,post};
}

function wcTable(y){
  if(y<1995)return '';
  const m=postModel(y);if(!m)return '';
  const era=y>=2022?3:y>=2012?2:1;
  const parts=['AL','NL'].filter(lg=>m.lgs[lg]&&m.lgs[lg].hasDv).map(lg=>{
    const L=m.lgs[lg];if(!L.rest.length)return '';
    const slots=m.post.length?L.wc.length:era;
    const lastIn=L.rest[Math.max(slots-1,0)];
    const rows=L.rest.slice(0,Math.max(slots+4,6)).map((t,i)=>{
      const inn=i<slots;

function splitSides(y){
  const ex=EXTRAS&&EXTRAS.seasons&&EXTRAS.seasons[y];
  const post=(ex&&ex.post)||[];
  if(!post.length)return null;
  const ser=post.map(r=>{const sc=splitScore(r.score);return {r,ord:r.ord!=null?r.ord:3,w:r.w,l:r.l,ww:sc[0],lw:sc[1]};});
  const ws=ser.filter(x=>x.ord===3).pop()||null;
  const rest=ser.filter(x=>x!==ws);
  const par=new Map();
  const root=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
  rest.forEach(x=>{[x.w,x.l].forEach(t=>{if(!par.has(t))par.set(t,t);});const a=root(x.w),b=root(x.l);if(a!==b)par.set(a,b);});
  const groups=new Map();rest.forEach(x=>{const g=root(x.w);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(x);});
  const lgm=leagueMap(y);
  const sides=Array.from(groups.values()).map(list=>{const v={AL:0,NL:0};list.forEach(x=>[x.w,x.l].forEach(t=>{const g=lgm.get(t);if(g)v[g]++;}));return {list,lg:v.AL>v.NL?'AL':(v.NL>v.AL?'NL':'')};});
  sides.sort((a,b)=>(a.lg==='AL'?0:a.lg==='NL'?2:1)-(b.lg==='AL'?0:b.lg==='NL'?2:1));
  return {ws,sides};
}

const fd=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?m[1]+'. '+(+m[2])+'. '+(+m[3])+'.':'';};
const fmtRange=(a,b)=>(fd(a)&&fd(b))?(a===b?fd(a):fd(a)+'~'+fd(b)):(fd(a)||fd(b));
function layoutSide(side,ords,seedOf,seeded){
  if(!side)return {nodes:[],leaves:0};
  const list=side.list,used=new Set(),nodes=[];
  let slot=0;
  const mins=x=>Math.min(seedOf(x.w),seedOf(x.l));
  const build=x=>{
    used.add(x);
    const cand=[];
    for(const t of [x.w,x.l]){const f=list.filter(z=>!used.has(z)&&cand.indexOf(z)<0&&z.ord<x.ord&&z.w===t).sort((a,b)=>b.ord-a.ord)[0];if(f)cand.push(f);}
    if(seeded)cand.sort((a,b)=>mins(b)-mins(a)); // 시드 번호가 큰 쪽(아래 시드)이 위, 1번 시드 쪽이 아래
    const kids=cand.map(build);
    const yy=kids.length?kids.reduce((a,k)=>a+k.y,0)/kids.length:slot++;
    const nd={s:x,y:yy,col:ords.indexOf(x.ord)};nodes.push(nd);return nd;
  };
  list.slice().sort((a,b)=>b.ord-a.ord).forEach(x=>{if(!used.has(x))build(x);});
  return {nodes,leaves:Math.max(slot,1)};
}
// 포스트시즌 대진표: 리그 띠 안에 라운드별 카드(팀 약어·시드·엠블럼·승수·날짜)를 왼쪽에서 오른쪽으로, 월드시리즈는 오른쪽 가운데
function bracketBoard(y){
  const bs=splitSides(y);if(!bs)return '';
  const pm=postModel(y);
  const lgm=leagueMap(y);
  const seeds=new Map(),recs=new Map();
  if(pm){
    for(const lg of ['AL','NL']){
      const L=pm.lgs[lg];if(!L)continue;
      L.T.forEach(t=>recs.set(t.n,t.w+'-'+t.l));
      if(y>=2012)L.dw.concat(L.wc).forEach((t,i)=>seeds.set(t.n,i+1));
    }
  }
  const seeded=seeds.size>0,seedOf=n=>seeds.get(n)||99;
  const CW=172,CH=124,CG=22,RG=14,HB=28,GAP=22;
  const sides=bs.sides.slice(0,2);
  const ords=Array.from(new Set(sides.reduce((a,sd)=>a.concat(sd.list.map(x=>x.ord)),[]))).sort((a,b)=>a-b);
  const lays=sides.map(sd=>layoutSide(sd,ords,seedOf,seeded));
  const cols=ords.length;
  const bandW=cols?cols*(CW+CG)-CG:0;
  let y0=0;const bands=[];
  lays.forEach((l,i)=>{const hh=l.leaves*(CH+RG)-RG;bands.push({hdr:y0,body:y0+HB,lay:l,side:sides[i]});y0+=HB+hh+GAP;});
  const totalH=Math.max(sides.length?y0-GAP:CH,CH);
  const wsX=cols?bandW+CG*2:0,W=wsX+CW;
  const wsY=(totalH-CH)/2;
  const pcard=(sx,label,left,top,cls)=>{
    const isWs=cls==='ws';
    const tm=[{n:sx.w,k:sx.ww},{n:sx.l,k:sx.lw}];
    if(!isWs&&seeded)tm.sort((a,b)=>seedOf(b.n)-seedOf(a.n));
    const rows=tm.map(t=>{
      const sub=isWs?(lgm.get(t.n)||''):(seeded&&seedOf(t.n)<99?'No.'+seedOf(t.n):(recs.get(t.n)||''));
      return '<div class="pcr"><div class="ab" role="button" data-act="team" data-t="'+esc(t.n)+'" data-y="'+y+'"><b>'+esc(tinfo(t.n).ab)+'</b><small>'+esc(sub)+'</small></div><span class="lgc">'+logo(t.n)+'</span><span class="scr'+(t.n===sx.w?' w':'')+'">'+(t.k==null?'':t.k)+'</span></div>';
    }).join('');
    const dt=fmtRange(sx.r.d1,sx.r.d2);
    return '<div class="pc '+cls+'" style="left:'+left+'px;top:'+top+'px"><div class="pch">'+esc(label)+'</div>'+rows+(dt?'<div class="pcd">'+dt+'</div>':'')+'</div>';
  };
  let h='<div class="card scroll"><div class="bk" style="width:'+W+'px;height:'+totalH+'px">';
  bands.forEach(b=>{
    const cls=b.side.lg==='AL'?'al':b.side.lg==='NL'?'nl':'';
    h+='<div class="bkh '+cls+'" style="left:0;top:'+b.hdr+'px;width:'+bandW+'px">'+(cls==='al'?'American League':cls==='nl'?'National League':'League')+'</div>';
    b.lay.nodes.forEach(nd=>{
      h+=pcard(nd.s,(b.side.lg||'')+['WC','DS','CS'][nd.s.ord],nd.col*(CW+CG),b.body+nd.y*(CH+RG),cls);
    });
  });
  if(bs.ws)h+=pcard(bs.ws,'World Series',wsX,wsY,'ws');
  return h+'</div></div>';
}

  document.getElementById('tabs').innerHTML=TABS.map(a=>'<button role="tab" data-act="tab" data-v="'+a[0]+'" aria-selected="'+(S.tab===a[0])+'">'+a[1]+'</button>').join('');
  const wide=(S.tab==='season'||S.tab==='draft'||S.tab==='awards');
  document.getElementById('filters').innerHTML=filtersHtml();
  document.getElementById('filters').style.display=wide?'none':'';
  document.getElementById('seg').style.display=wide?'none':'';
  const ctb=document.getElementById('ctbox');if(ctb)ctb.hidden=!SHOW_SAL;
  const bk=document.querySelector('.back');if(bk)bk.hidden=!SHOW_KBO;
  renderView();
  renderData();
}
function renderView(){
  sanitize();
  const fn=({profile:vProfile,compare:vCompare,trend:vTrend,rank:vRank,top:vTop,season:vSeason,awards:vAwards,draft:vDraft})[S.tab]||vProfile;
  document.getElementById('app').innerHTML=fn();
  updateCount();
}

/* ---------- 이벤트 ---------- */
function say(text,err){const el=document.getElementById('msg');el.textContent=text;el.className='msg'+(err?' err':'');}
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='league'){enterLeague(t.dataset.v);return;}
  else if(a==='home'){if(!SHOW_KBO)return;S.league=null;}
  else if(a==='team'){S.teamSel=t.dataset.t;if(t.dataset.y)S.season=parseInt(t.dataset.y,10);S.tab='season';}
  else if(a==='teamback'){S.teamSel='';}
  else if(a==='gop'){const gp=find(t.dataset.id);if(gp){S.type=gp.t==='h'?'hitter':'pitcher';S.q='';S.scope='all';S.team='';S.favOnly=false;const ys=seasonsOf(gp);S.season=ys[ys.length-1];S.pid=gp.id;S.tab='profile';}}
  else if(a==='dmore'){S.dN+=50;}
  else if(a==='awmode'){S.awMode=t.dataset.v;}
  else if(a==='brmode'){S.brMode=t.dataset.v;}
  else if(a==='tab'){S.tab=t.dataset.v;if(S.tab==='draft')ensureDraft();}
  else if(a==='type'){if(S.type!==t.dataset.v){S.type=t.dataset.v;initSel();}}
  else if(a==='scope'){S.scope=t.dataset.v;S.rankN=20;}
  else if(a==='cclear'){CT={byId:new Map(),byName:new Map(),n:0};lsDel(ctKey());say('연봉·계약 자료를 지웠습니다.');}
  else if(a==='qualon'){S.scope='qual';}
  else if(a==='tomet'){S.rmetric=t.dataset.m;S.tab='rank';S.rankN=20;}
  else if(a==='rm'){S[t.dataset.key]=S[t.dataset.key].filter(id=>id!==t.dataset.id);}
  else if(a==='fav'){const id=t.dataset.id,i=S.fav.indexOf(id);if(i>=0)S.fav.splice(i,1);else S.fav.push(id);lsSet(favKey(),JSON.stringify(S.fav));}
  else if(a==='favonly'){S.favOnly=!S.favOnly;}
  else if(a==='more'){S.rankN+=20;}
  else if(a==='reset'){lsDel(dsKey());applyDataset(sampleDataset(S.league));say('샘플 데이터로 되돌렸습니다.');}
  else return;
  render();
});
// 이름 검색: 입력창은 그대로 두고 본문만 다시 그립니다(커서가 사라지지 않도록).
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){S.q=e.target.value;S.rankN=20;renderView();}
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.id==='cfile'){
    const cf=t.files&&t.files[0];if(!cf)return;
    const crd=new FileReader();
    crd.onerror=function(){say('파일을 읽지 못했습니다.',true);};
    crd.onload=function(){
      try{const text=String(crd.result);loadContracts(text);const saved=lsSet(ctKey(),text);render();say('연봉·계약 자료 '+CT.n+'건을 불러왔습니다.'+(saved?'':' (이 브라우저에는 저장하지 못했습니다)'));}
      catch(err){say('불러오지 못했습니다. '+err.message,true);}
      t.value='';
    };
    crd.readAsText(cf);
    return;
  }
  if(t.id==='file'){
    const f=t.files&&t.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onerror=function(){say('파일을 읽지 못했습니다.',true);};
    rd.onload=function(){
      try{
        const text=String(rd.result),ds=JSON.parse(text);
        applyDataset(ds);
        const saved=lsSet(dsKey(),text);
        render();
        say(saved?'불러왔습니다. 이 브라우저에 저장해서 다시 열어도 유지됩니다.':'불러왔습니다. 이 브라우저에는 저장하지 못해 새로고침하면 사라집니다.');
      }catch(err){
        say('불러오지 못했습니다. '+err.message,true);
      }
      t.value='';
    };
    rd.readAsText(f);
    return;
  }
  const act=t.dataset&&t.dataset.act;
  if(act==='set'){const k=t.dataset.key;if(k==='pid')S.pidJust=true;
  S[k]=(k==='season'||k==='dyear')?parseInt(t.value,10):t.value;if(k==='dyear'||k==='dround')S.dN=50;render();}
  else if(act==='add'){const k=t.dataset.key;if(t.value&&S[k].length<4&&S[k].indexOf(t.value)<0)S[k].push(t.value);render();}
});

/* ---------- 시작 ---------- */
if(SHOW_KBO)render(); else enterLeague('mlb'); // KBO는 주소 뒤에 ?kbo=1 을 붙일 때만 보입니다
window.__mlb={enterLeague,render,S};
})();
</script>
